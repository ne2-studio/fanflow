# Local development environment: Postgres + both services, each built from its own Dockerfile.
#
# The frontend's Dockerfile only copies a pre-built `dist/` into nginx (it doesn't run `npm build`
# itself — that happens in CI). Before `docker compose up --build`, run:
#   cd frontend && cp .env.example .env && npm install && npm run build
# VITE_API_URL is baked into the build at build time, so make sure frontend/.env points at
# http://localhost:5050 (the backend port mapped below) before building.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: fanflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d fanflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=fanflow;Username=devuser;Password=devpass"
      Publishing__PublicHostname: "http://localhost:8081"
      Publishing__Minio__Endpoint: "http://minio:9000"
      Publishing__Minio__AccessKey: "minioadmin"
      Publishing__Minio__SecretKey: "minioadmin"
      Publishing__Minio__Bucket: "releases"
    ports:
      - "5050:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Internet-facing static site container: serves published release landing pages straight from
  # MinIO and proxies the tracking beacons (/pv, /out, /trap) to the backend. This is what
  # Publishing:PublicHostname (above) points at in production.
  site:
    build:
      context: ./site
      dockerfile: Dockerfile
    environment:
      MINIO_ENDPOINT: "minio:9000"
      MINIO_BUCKET: "releases"
      BACKEND_HOST: "backend:8080"
    ports:
      - "8081:80"
    depends_on:
      minio:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  pgdata:
  miniodata:
